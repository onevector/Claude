name: Diagnose Site Structure

"on":
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: python scripts/diagnose.py
        continue-on-error: true
      - run: python scripts/diagnose2.py
        continue-on-error: true
      - run: python scripts/diagnose3.py
        continue-on-error: true
      - run: python scripts/diagnose4.py
        continue-on-error: true
      - run: python scripts/diagnose5.py
        continue-on-error: true
