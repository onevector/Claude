name: Harvest Chamber Events

"on":
  schedule:
    # ~2:00 AM America/Los_Angeles (2:00 AM during PDT, 1:00 AM during PST -
    # GitHub Actions cron doesn't do DST). Good enough for a nightly refresh.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: harvest-chamber-events
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run harvester
        run: python -m harvester.main

      - name: Commit updated feed
        run: |
          git config user.name "chamber-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/events.ics
          if git diff --cached --quiet; then
            echo "No changes to events.ics"
          else
            git commit -m "chore: refresh chamber events feed"
            git push
          fi
